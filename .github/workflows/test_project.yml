---
name: test-project

# yamllint disable-line rule:truthy
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is not officially supported yet: re-add it to the matrix
        # once it is. It should install (requires-python >=3.10,<4.0).
        # python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          install_graphviz: "true"

      - name: Run full test gate
        run: task test
