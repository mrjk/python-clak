---
name: gen-documentation

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Deploy via GitHub Actions so GitHub does not run the built-in
# pages-build-deployment job (checkout@v4 / upload-artifact@v4, Node 20).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: "3.10"
          poetry_args: "--with docs,dev"
          install_graphviz: "true"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: poetry run task docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
