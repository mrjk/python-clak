---
name: publish-pypi

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: ${{ matrix.python-version }}
          install_graphviz: "true"

      - name: Run full test gate
        run: task test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with:
          python_version: "3.12"

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "::error::PYPI_TOKEN is empty. Add a GitHub Actions *secret*" \
              "(not a variable) named PYPI_TOKEN on the 'pypi' environment" \
              "or the repository."
            exit 1
          fi
          case "${PYPI_TOKEN}" in
            pypi-*) ;;
            *)
              echo "::error::PYPI_TOKEN must be a PyPI API token starting" \
                "with 'pypi-' (from https://pypi.org/manage/account/token/," \
                "not TestPyPI)."
              exit 1
              ;;
          esac
          export UV_PUBLISH_TOKEN="${PYPI_TOKEN}"
          task publish_pypi
