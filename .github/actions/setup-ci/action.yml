---
name: Setup CI
description: Install mise-managed tools and uv dependencies

inputs:
  uv_args:
    description: Extra args for uv sync (e.g. --no-group docs)
    required: false
    default: ""
  python_version:
    description: Overrides mise Python via PYTHON_VERSION
    required: false
    default: "3.12"
  install_graphviz:
    description: If true, apt-install graphviz (docs / pyreverse)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Graphviz
      if: inputs.install_graphviz == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install mise tools
      uses: jdx/mise-action@v4
      with:
        cache: true
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
        # rpds-py builds via PyO3; 3.14 is newer than PyO3 0.24's declared max (3.13)
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      run: uv sync --locked --python "$(mise which python)" ${{ inputs.uv_args }}
