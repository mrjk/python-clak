[project]
name = "mrjk.clak"
version = "0.6.0"
description = "Command Line avec Klass"
authors = [
    {name = "mrjk", email = "mrjk.78@gmail.com"}
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
]
dependencies = [
    "argcomplete (>=3.6.2,<4.0.0)",
    "prettytable (>=3.16.0,<4.0.0)"
]

[project.urls]
Homepage = "https://github.com/mrjk/python-clak"
Documentation = "https://mrjk.github.io/python-clak/"
Repository = "https://github.com/mrjk/python-clak"
Issues = "https://github.com/mrjk/python-clak/issues"

[project.optional-dependencies]
colors = ["coloredlogs (>=15.0.1,<16.0.0)"]
config = ["pyyaml (>=6.0,<7.0)"]
markdown = ["rich (>=14.0.0,<15.0.0)"]
rst = ["docutils (>=0.21.0,<1.0.0)"]

[tool.poetry]
packages = [{include = "clak/"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# Dependencies groups
# ========================

[tool.poetry.group.dev.dependencies]
coloredlogs = "^15.0.1"
black = "^24.10.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
jupyterlab = "^4.3.4"
pytest-regressions = "^2.6.0"
pytest-clarity = "^1.0.1"
pylint = "^3.3.3"
yamllint = "^1.35.1"
pymarkdownlnt = "^0.9.26"
pytest-tagging = "^1.6.0"
sh = "^2.2.1"
rich = "^14.0.0"
docutils = "^0.21.0"

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.5.49"
mkdocs-simple-hooks = "^0.1.5"
mkdocstrings = {extras = ["python"], version = "^1.0.0"}
mkdocs-awesome-pages-plugin = "^2.10.1"
mdx-truly-sane-lists = "^1.3"
pylint = "^3.3.3"


# Pytest config
# ========================
[tool.pytest.ini_options]
pythonpath = [
  ".", "tests"
]
markers = [
  "tags: classification tags (pytest-tagging)",
]

