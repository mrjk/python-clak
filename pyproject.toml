[project]
name = "mrjk.clak"
version = "0.6.1"
description = "Command Line avec Klass"
authors = [
    {name = "mrjk", email = "mrjk.78@gmail.com"}
]
license = "GPL-3.0-only"
readme = "README.md"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
]
dependencies = [
    "argcomplete (>=3.6.2,<4.0.0)",
    "prettytable (>=3.16.0,<4.0.0)"
]

[project.urls]
Homepage = "https://github.com/mrjk/python-clak"
Documentation = "https://mrjk.github.io/python-clak/"
Repository = "https://github.com/mrjk/python-clak"
Issues = "https://github.com/mrjk/python-clak/issues"

[project.optional-dependencies]
colors = ["coloredlogs (>=15.0.1,<16.0.0)"]
config = ["pyyaml (>=6.0,<7.0)"]
markdown = ["rich (>=14.0.0,<15.0.0)"]
rst = ["docutils (>=0.21.0,<1.0.0)"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution is `mrjk.clak` but the import package is `clak/` at repo root.
module-name = "clak"
module-root = ""


# Dependencies groups
# ========================

[dependency-groups]
dev = [
    "coloredlogs>=15.0.1,<16",
    "black>=24.10.0,<25",
    "pytest>=8.3.4,<9",
    "pytest-cov>=6.0.0,<7",
    "jupyterlab>=4.3.4,<5",
    "pytest-regressions>=2.6.0,<3",
    "pytest-clarity>=1.0.1,<2",
    "pylint>=3.3.3,<4",
    "yamllint>=1.35.1,<2",
    "pymarkdownlnt>=0.9.26,<0.10",
    "pytest-tagging>=1.6.0,<2",
    "sh>=2.2.1,<3",
    "rich>=14.0.0,<15",
    "docutils>=0.21.0,<0.22",
]
docs = [
    "mkdocs-material>=9.5.49,<10",
    "mkdocs-simple-hooks>=0.1.5,<0.2",
    "mkdocstrings[python]>=1.0.0,<2",
    "mkdocs-awesome-pages-plugin>=2.10.1,<3",
    "mdx-truly-sane-lists>=1.3,<2",
    "pylint>=3.3.3,<4",
]

[tool.uv]
# Same as Poetry's non-optional groups: `uv sync` installs dev + docs.
default-groups = ["dev", "docs"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


# Pytest config
# ========================
[tool.pytest.ini_options]
pythonpath = [
  ".", "tests"
]
markers = [
  "tags: classification tags (pytest-tagging)",
]

